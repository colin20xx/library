    <style>
        .sidebar {
            position: fixed; /* Fixes the menu in place */
            top: 0;
            left: 0;

            background-color: #f8f9fa; /* Optional: adds a background color */

        .content {

        /*-----------------------------------------------------------------------------------[ table with fixed header ]------*/
        .table-container {
            /* Set a maximum height to enable vertical scrolling */
            max-height: 250px;
            /* Enable scrolling (both vertical and horizontal if needed) */
            overflow: auto;
            /* Optional: Add a border for clarity */
            border: 1px solid #ccc;
        }

        table {
            /* Ensure the table takes full width of the container */
            width: 100%;
            /* Optional: better control over borders */
            border-collapse: collapse;
        }

        th, td {
            /* Optional: basic styling */
            padding: 8px 16px;
            border: 1px solid #ccc;
        }

        .table-container thead th {
            /* The key property: position the header cells sticky */
            position: sticky;
            /* Stick to the top of the scrolling container */
            top: 0;
            /* Ensure the header is above the body content when scrolling */
            z-index: 2;
            /* Set a background color so content doesn't show through */
            background-color: #f7f7f7;
        }
    </style>
</head>
