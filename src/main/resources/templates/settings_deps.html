<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"> </script>
    <script src="/js/jquery-4.0.0.min.js"> </script>
    <script src="/js/script.js"> </script>
</head>
<body>

<nav th:replace="~{fragments.html :: main_menu}"> </nav>


<div th:replace="~{fragments.html :: settings_vertical_menu_01}"> </div>

    <div class="content_settings_div">

            <div class="navbar navbar-light bg-light mb-2">
                <a class="link-offset-2-hover" href="deps/formaddnewdep?disformed=false">новий підрозділ</a>
            </div>


        <div class="table-container">
            <table style="width: auto">
                <thead>
                    <tr>
                        <th>№ з/п</th>
                        <th>id</th>
                        <th>скорочено</th>
                        <th>повне найменування</th>
                        <th>матеріально відповідальна особа</th>
                        <th style="text-align: center">активний</th>
                        <th style="text-align: center">створений</th>
                    </tr>

                </thead>
                <tbody>
                    <tr th:each="dep : ${deps}" th:class="${!dep.isDisformed()} ? 'active-bg' : 'disactive-bg' ">
                        <td style="text-align: center"><span th:text="${dep.getSortingNumber()}"></span></td>
                        <td style="text-align: center" th:text="${dep.id}"></td>
                        <td><span th:text="${dep.getShortName()}"></span></td>
                        <td><a  th:href="@{/settings/__${dep.getId()}__}" th:text="${dep.getFullName()}"></a></td>
                        <td><span th:text="${dep.getResponsablePersone()}"></span></td>
                        <td>
                            <div class="container-buttons">
                                <button id="edit" disabled>&#9998;</button>

                                <button th:id="${dep.getId()}" name="cmd_change_status" onclick="executeDepAction(this)"
                                        th:text="${dep.isDisformed()} ? 'X' : 'O'"></button>

                                <button th:id="${dep.getId()}" name="cmd_del_dep" onclick="executeDepAction(this)">&#128465;</button>
                            </div>
                        </td>
                        <td style="text-align: center"> <span th:text="${#temporals.format(dep.getCreatedAtDate(), 'dd.MM.yyyy')}"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
