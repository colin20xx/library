<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Типи підрозділів</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"> </script>
    <script src="/js/jquery-4.0.0.min.js"> </script>
    <script src="/js/script.js"> </script>
</head>
<body>

<nav th:replace="~{fragments.html :: main_menu}"> </nav>

<div th:replace="~{fragments.html :: settings_vertical_menu_01}"> </div>

<div class="content_settings_div">
    <table class="table table-bordered table-hover small">
        <thead>
        <tr>
            <th>id</th>
            <th>Тип укр</th>
            <th>Тип анг</th>
            <th>Примітка</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dep_type : ${deps_types}">
            <td th:text="${dep_type.id}"></td>
            <td th:text="${dep_type.nameUA}"></td>
            <td th:text="${dep_type.nameEnglish}"></td>
            <td th:text="${dep_type.description}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
