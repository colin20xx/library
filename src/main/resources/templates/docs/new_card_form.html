<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Нова картка</title>
    <th:block th:replace="~{fragments.html :: baseContent}"></th:block>

<!--    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">-->

</head>

<body data-page="new-card-page">

<nav th:replace="~{fragments.html :: main_menu}"> </nav>

<div style="margin-top: 1px; padding: 1px; height: 800px">

    <form method="post" th:object="${new_card}" th:action="@{/doc/save_card_and_get_content_form}" class="h-100">


                    <div class="container-fluid bg-light h-100">


                            <div class="row h-100">
                                <div class="col-8 p-2 mb-2 d-inline">
                                    <input id="input-denom" style="margin-bottom: 2px" type="text" name="denomTitle" oninput="findAllByName(this)" placeholder="найменування">
                                    <select id="select_om" class="form-select" disabled>
                                        <option th:each="om: ${om_list}" th:value="${om.id}" th:text="${om.objectName}"></option>
                                    </select>
                                    <script>
                                        $('#select_om').select2();
                                    </script>
                                    <input id="input-nomenlature" style="margin-bottom: 2px" type="text" name="nomenclatureTitle" oninput="findAllByName(this)" placeholder="номенклатура" disabled>

                                    <div class="div-scrollable-01" style="height: 400px">
<!--                                        class="table table-bordered table-hover small p-0"-->
                                        <table class="scrollable-table">
                                            <thead class="fixed-header">
                                                <tr>
                                                    <th scope="col">найменування</th>
                                                    <th scope="col" style="width: 150px">к-сть номенклатур</th>
                                                    <th scope="col" style="width: 150px">об'єкт</th>
                                                </tr>
                                            </thead>
                                            <tbody id="denominationList">
                                                <tr th:each="rowData: ${denom_list}" th:data-id="${rowData.denominationId}">
                                                    <td class="p-1" th:text="${rowData.denominationName}"></td>
                                                    <td class="p-1" th:text="${rowData.nomenclatures == 0 ? '' : rowData.nomenclatures}"></td>
                                                    <td class="p-1" th:text="${rowData.objectName}"></td>
                                                </tr>
                                        </tbody>
                                        </table>
                                    </div>

                                    <select style="width: 100%; margin-top: 5px" size="10" id="select-nomenclature-list" class="form-select"></select>

                                </div>

                                <div class="col p-1">
                                    <table class="table table-borderless table-sm small p-0">
                                        <tbody>
                                            <tr> <th style="width: 50px">Обє'кт:</th>  <td id="td_om_selected">  </td> </tr>
                                            <tr style="height: 50px;"> <th>найменування:</th> <td id="td_denomination_selected">  </td> </tr>
                                            <tr style="height: 50px"> <th>номенклатура:</th> <td id="td_nomenclature_selected">  </td> </tr>
                                        </tbody>
                                    </table>

                                    <table class="table table-borderless table-sm small p-0">

                                        <tbody id="tableCardBodyForm">

                                        <tr>
                                            <td>номер картки:</td>
                                            <td>
                                                <input id="card_number" style="width: 150px; margin-bottom: 2px;" type="text" th:field="*{cardNumber}">
                                                <input id="input_card_next_num" type="button" value="наступний номер">
                                                <input type="text" readonly id="field_denomination_id" name="denom_id" class="input-w-40">
                                                <input type="text" readonly id="field_nomenclature_id" name="nomencl_id" class="input-w-40">
                                                <input type="text" readonly id="field_doc_type_id" name="doc_type_id" th:field="*{docType}" class="input-w-40">
                                            </td>
                                        </tr>
<!--                                        <tr>-->
<!--                                            <td>категорія:</td>-->
<!--                                            <td>-->
<!--                                                <div class="btn-group-sm d-flex w-100 gap-2">-->
<!--                                                    <button class="btn btn-light flex-fill">1</button>-->
<!--                                                    <button class="btn btn-light flex-fill">2</button>-->
<!--                                                    <button class="btn btn-light flex-fill">3</button>-->
<!--                                                    <button class="btn btn-light flex-fill">4</button>-->
<!--                                                    <button class="btn btn-light flex-fill">5</button>-->
<!--                                                </div>-->
<!--                                                <select id="category" class="form-select" th:field="*{category}">-->
<!--                                                    <option value="1">I</option>-->
<!--                                                    <option value="2" selected>II</option>-->
<!--                                                    <option value="3">III</option>-->
<!--                                                    <option value="4">IV</option>-->
<!--                                                    <option value="5">V</option>-->
<!--                                                </select>-->
<!--                                            </td>-->
<!--                                        </tr>-->
                                        <tr>
                                            <td>категорія:</td>
                                            <td>
                                                <div class="btn-group w-100 gap-1 btn-group-sm" role="group" aria-label="Категорія">

                                                    <input type="radio" class="btn-check" th:field="*{category}" id="category1" value="1">
                                                        <label class="btn btn-light" for="category1">I</label>

                                                    <input type="radio"
                                                           class="btn-check"
                                                           th:field="*{category}"
                                                           id="category2"
                                                           value="2">
                                                    <label class="btn btn-light" for="category2">II</label>

                                                    <input type="radio"
                                                           class="btn-check"
                                                           th:field="*{category}"
                                                           id="category3"
                                                           value="3">
                                                    <label class="btn btn-light" for="category3">III</label>

                                                    <input type="radio"
                                                           class="btn-check"
                                                           th:field="*{category}"
                                                           id="category4"
                                                           value="4">
                                                    <label class="btn btn-light" for="category4">IV</label>

                                                    <input type="radio"
                                                           class="btn-check"
                                                           th:field="*{category}"
                                                           id="category5"
                                                           value="5">
                                                    <label class="btn btn-light" for="category5">V</label>

                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>дата створення:</td>
                                            <td>
                                                <input id="created_at" class="form-control form-control-sm" type="datetime-local" value="" name="created_at">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>ціна:</td>
                                            <td><input id="price" class="form-control form-control-sm" type="number" step="0.00001" min="0" th:field="*{price}" oninput="countTotals()"></td>
                                        </tr>
                                        <tr>
                                            <td>кількість склад СНСО:</td>
                                            <td>
                                                <input id="qty_bts" class="form-control form-control-sm" type="number" step="0.00001" min="0" th:field="*{qtyBTS}" oninput="countTotals()">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>кількість польовий склад:</td>
                                            <td><input id="qty_pls" class="form-control form-control-sm" type="number" step="0.00001" min="0" th:field="*{qtyPS}"  oninput="countTotals()"></td>
                                        </tr>
                                        <tr>
                                            <td>кількість підрозділи:</td>
                                            <td><input id="qty_deps" class="form-control form-control-sm" type="number" step="0.00001" min="0" th:field="*{qtyDEPS}"  oninput="countTotals()"></td>
                                        </tr>
                                        <tr>
                                            <td>загальна кількість:</td>
                                            <td><input id="qty_tot" class="form-control form-control-sm" readonly type="text" th:field="*{totalQty}"  oninput="countTotals()"></td>
                                        </tr>
                                        <tr>
                                            <td>загальна сума:</td>
                                            <td>
                                                <input id="qty_amount_to_show" class="form-control form-control-sm" readonly type="text" oninput="countTotals()">
                                                <input id="qty_amount_to_send" class="form-control form-control-sm" readonly type="hidden" th:field="*{totalSum}"  oninput="countTotals()">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>примітка:</td>
                                            <td><input id="comment" class="form-control form-control-sm" type="text" th:field="*{comments}"></td>
                                        </tr>
                                        </tbody>
                                    </table>


                                        <div class="input-group">
                                            <input id="inputDocSubmit" type="submit" class="form-control" value="зберегти">
                                            <input id="inputClearForm" type="submit" class="form-control" value="очистити">
                                        </div>


                                </div>

                            </div>
                    </div>
    </form>
</div>

</body>
</html>
