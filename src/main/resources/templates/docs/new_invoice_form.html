<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Новий документ</title>
    <th:block th:replace="~{fragments.html :: baseContent}"></th:block>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>

</head>

<body>
<nav th:replace="~{fragments.html :: main_menu}"> </nav>
<!--<header th:insert="~{fragments.html :: main_menu}"> </header>-->

<div>
    <form method="post" th:object="${new_invoice}" th:action="@{/doc/save_invoice_and_get_content_form}">
        <div class="container-fluid">
            <div class="row">

                <div class="col-2">
                    <div class="p-1">
                        left side - short instant info
                    </div>
                </div>

                <div class="col p-2 text-bg-light">

                    <div class="container-fluid">

                        <div class="row g-3">

                            <div class="col-md-3 p-1">
                                <input type="hidden" id="id_doc_type" th:field="*{documentsType}">
                                <label for="doc_num" class="col-form-label-sm">номер документа:</label>
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control border-secondary" id="doc_num" th:field="*{number}" oninput="checkDocNumber(this)">
                                    <button id="btn_last_invoice_num" class="btn btn-outline-secondary" type="button" onclick="">&#8470</button>
                                </div>
                            </div>

                            <div class="col-md-3 p-1"><div>
                                <label for="data_doc" class="col-form-label-sm">дата документа:</label>
                                <input type="datetime-local" id="data_doc" class="form-control border-secondary " th:field="*{documentDate}">
                                <script>
                                    flatpickr("#data_doc", {
                                    enableTime: true, time_24hr: true, dateFormat: "d.m.Y H:i", defaultDate: new Date(),
                                    onChange: function (selectedDates, dateStr, instance) {
                                        document.getElementById('data_doc_oper').value = dateStr;
                                        let date = new Date(selectedDates[0]);
                                        date.setDate(date.getDate() + 3);
                                        let day = String(date.getDate()).padStart(2,'0');
                                        let month = String(date.getMonth()+1).padStart(2,'0');
                                        let year = String(date.getFullYear());
                                        let hour = String(date.getHours()).padStart(2,'0');
                                        let minutes = String(date.getMinutes()).padStart(2,'0');

                                        document.getElementById('data_doc_during').value = `${day}.${month}.${year} ${hour}:${minutes}`
                                    }
                                }); </script>
                            </div></div>

                            <div class="col-md-3 p-1"><div>
                                <label for="data_doc_oper" class="col-form-label-sm">дата операції:</label>
                                <input type="text" id="data_doc_oper" class="form-control" th:field="*{operationDate}">
                                <script> flatpickr("#data_doc_oper", {
                                    enableTime: true,
                                    time_24hr: true,
                                    dateFormat: "d.m.Y H:i"
                                }); </script>
                            </div></div>

                            <div class="col-md-3 p-1"><div>
                                <label for="data_doc_oper" class="col-form-label-sm">дата дійсний до:</label>
                                <input type="text" id="data_doc_during" class="form-control" th:field="*{expiresAt}">
                                <script> flatpickr("#data_doc_during", {
                                    enableTime: true,
                                    time_24hr: true,
                                    dateFormat: "d.m.Y H:i"
                                }); </script>
                            </div></div>
                        </div>
<!--                        <span style="width:50px">${objItem.text}</span>-->
                        <script>

                            $(document).ready(function () {
                                $('#sender_page').select2();
                            });
                        </script>
                        <div class="row g-3">
                            <div class="col-md-6 p-1">

                                <script th:inline="javascript"> var departList = /*[[${dep_list}]]*/ []; </script>

                                <label class="col-form-label-sm" for="sender_page">вантажовідправник:</label>

                                <div class="input-group">
                                    <select id="sender_page" class="form-select w-75" name="serder_ids" onchange="getRespPersone(this, sender_name, departList)">
                                            <option value=" "></option>
                                            <option
                                                    th:each="dep : ${dep_list}"
                                                    th:value="${dep.getIdDep() + '_' + (dep.getIdSubDep() != null ? dep.getIdSubDep() : 0)}"
                                                    th:text="${dep.getDepsShortName() +' '+ (dep.getSubDepsShortName()!=null ? dep.getSubDepsShortName() : '')}"
                                                    th:data-dep = "${dep.depsShortName}"
                                                    th:data-subdep = "${(dep.subDepsShortName != null ? dep.subDepsShortName : '')}">
                                            </option>
                                    </select>
                                    <button type="button" style="height: 28px" class="btn btn-outline-secondary btn-sm" onclick="selectSklad(this, sender_page, '71_0')">П Склад</button>
                                    <button type="button" style="height: 28px" class="btn btn-outline-secondary btn-sm" onclick="selectSklad(this, sender_page,'72_0')">БТ Склад</button>

                                </div>
                                <div>
                                    <label class="col-form-label-sm" for="sender_name">відповідальна особа:</label>
                                    <input id="sender_name" type="text" class="form-control" th:field="*{responsiblePersonSender}">
                                </div>
                            </div>

                            <div class="col-md-6 p-1">
                                <label class="col-form-label-sm" for="receiver_page">вантажоодержувач:</label>
                                <div class="input-group">

                                    <select id="receiver_page" class="form-select w-75" name="receiver_ids" onchange="getRespPersone(this, receiver_name, departList)">
                                        <option value=""></option>
                                        <option
                                                th:each="dep : ${dep_list}"
                                                th:value="${dep.getIdDep()+ '_'+  (dep.getIdSubDep() != null ? dep.getIdSubDep() : 0)}"
                                                th:text="${dep.getDepsShortName() +' '+ (dep.getSubDepsShortName()!=null ? dep.getSubDepsShortName() : '') }"
                                                th:data-dep = "${dep.depsShortName}"
                                                th:data-subdep = "${(dep.subDepsShortName != null ? dep.subDepsShortName : '')}">
                                        </option>
                                    </select>
                                    <button id="btn_receiver_ps" type="button" style="height: 28px" class="btn btn-outline-secondary btn-sm" onclick="selectSklad(this, receiver_page, '71_0')">П Склад</button>
                                    <button id="btn_receiver_bts" type="button" style="height: 28px" class="btn btn-outline-secondary btn-sm" onclick="selectSklad(this, receiver_page,'72_0')">БТ Склад</button>
                                </div>

                                <script>
                                    $(document).ready(function () {


                                        function formatOption(option) {
                                            if (!option.id) {
                                                return option.text;
                                            }

                                            const secondColumn = $(option.element).data('subdep');

                                            return $(`
                                                    <div style="display:grid; grid-template-columns: 150px 1fr;">
                                                        <span>${option.text}</span>
                                                        <span style="color:#555555;">${secondColumn ?? ''}</span>
                                                    </div>
                                                `);
                                        }

                                        $('#receiver_page').select2({
                                            templateResult: formatOption,
                                            templateSelection: function(option) {
                                                return option.text; // selected value remains "val1"
                                            }
                                        });

                                    });
                                </script>

                                <label class="col-form-label-sm">відповідальна особа:</label>
                                <input id="receiver_name" type="text" class="form-control" th:field="*{responsiblePersonReceiver}">
                            </div>
                        </div>


                        <div class="row g-3">
                            <div class="col p-1">
                                <label class="col-form-label-sm" for="doc_reason">підстава:</label>
                                <input type="text" class="form-control" id="doc_reason" value="">
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col p-1">
                                <label class="col-form-label-sm" for="doc_comments">примітка:</label>
                                <input type="text" class="form-control" id="doc_comments" value="примітка" th:field="*{comments}">
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-2 p-1">
                                <input id="inputDocSubmit" type="submit" class="form-control" value="зберегти" disabled>
                            </div>

                        </div>
                    </div>

                </div>

                </div>

            </div>
    </form>
</div>

</body>
</html>
