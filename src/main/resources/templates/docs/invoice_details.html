<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title th:text="${invoice.number}"></title>
    <th:block th:replace="~{fragments.html :: baseContent}"></th:block>
</head>

<body data-page="invoice-details-page">
<nav th:replace="~{fragments.html :: main_menu}"> </nav>

    <div style="border: 0px solid #6f42c1; width: 100%; background-color: #f5f5f5; margin: 2px; padding: 5px">

        <table class="table-doc-info" th:object="${invoice}">
            <tr th:class="${invoice.commitedAt != null ? 'commited-done-row' : 'commited-none-row'}" class="commited-done-row">
                <td colspan="4">
                    <div style="display: inline-block;">
                        <img src="/images/doc_icon_small_01.png" style="width: 30px; height: auto; margin-top: -17px" alt="">
                    </div>
                    <span th:text="${'Накладна №' + invoice.number + ' від ' + #dates.format(invoice.documentDate, 'dd.MM.yyyy')}"></span>
                </td>
                <td colspan="2">
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/documents/{id}/pdf(id=${invoice.id})}"
                           target="_blank" class="btn btn-outline-success d-inline-flex align-items-center justify-content-center"
                           title="завантажити excel">
<!--                            style="width: 40px; height: 40px;"-->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-excel-fill" viewBox="0 0 16 16">
                                <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M5.884 6.68 8 9.219l2.116-2.54a.5.5 0 1 1 .768.641L8.651 10l2.233 2.68a.5.5 0 0 1-.768.64L8 10.781l-2.116 2.54a.5.5 0 0 1-.768-.641L7.349 10 5.116 7.32a.5.5 0 1 1 .768-.64"/>
                            </svg>

                        </a>
                        <a th:href="@{/documents/{id}/pdf(id=${invoice.id})}"
                           target="_blank" class="btn btn-outline-danger d-inline-flex align-items-center justify-content-center"
                           title="завантажити pdf">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-pdf-fill" viewBox="0 0 16 16">
                                <path d="M5.523 12.424q.21-.124.459-.238a8 8 0 0 1-.45.606c-.28.337-.498.516-.635.572l-.035.012a.3.3 0 0 1-.026-.044c-.056-.11-.054-.216.04-.36.106-.165.319-.354.647-.548m2.455-1.647q-.178.037-.356.078a21 21 0 0 0 .5-1.05 12 12 0 0 0 .51.858q-.326.048-.654.114m2.525.939a4 4 0 0 1-.435-.41q.344.007.612.054c.317.057.466.147.518.209a.1.1 0 0 1 .026.064.44.44 0 0 1-.06.2.3.3 0 0 1-.094.124.1.1 0 0 1-.069.015c-.09-.003-.258-.066-.498-.256M8.278 6.97c-.04.244-.108.524-.2.829a5 5 0 0 1-.089-.346c-.076-.353-.087-.63-.046-.822.038-.177.11-.248.196-.283a.5.5 0 0 1 .145-.04c.013.03.028.092.032.198q.008.183-.038.465z"/>
                                <path fill-rule="evenodd" d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2m5.5 1.5v2a1 1 0 0 0 1 1h2zM4.165 13.668c.09.18.23.343.438.419.207.075.412.04.58-.03.318-.13.635-.436.926-.786.333-.401.683-.927 1.021-1.51a11.7 11.7 0 0 1 1.997-.406c.3.383.61.713.91.95.28.22.603.403.934.417a.86.86 0 0 0 .51-.138c.155-.101.27-.247.354-.416.09-.181.145-.37.138-.563a.84.84 0 0 0-.2-.518c-.226-.27-.596-.4-.96-.465a5.8 5.8 0 0 0-1.335-.05 11 11 0 0 1-.98-1.686c.25-.66.437-1.284.52-1.794.036-.218.055-.426.048-.614a1.24 1.24 0 0 0-.127-.538.7.7 0 0 0-.477-.365c-.202-.043-.41 0-.601.077-.377.15-.576.47-.651.823-.073.34-.04.736.046 1.136.088.406.238.848.43 1.295a20 20 0 0 1-1.062 2.227 7.7 7.7 0 0 0-1.482.645c-.37.22-.699.48-.897.787-.21.326-.275.714-.08 1.103"/>
                            </svg>
                        </a>

                        <a th:href="@{/documents/{id}/pdf(id=${invoice.id})}"
                           target="_blank"
                           th:class="${invoice.commitedAt != null ? 'btn btn-outline-warning d-inline-flex align-items-center justify-content-center disabled' : 'btn btn-outline-warning d-inline-flex align-items-center justify-content-center'}"
                           title="редагувати документ">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen-fill" viewBox="0 0 16 16">
                                <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001"/>
                            </svg>
                        </a>

                        <button
                                th:data-url="@{/invoice/{id}(id=${invoice.id})}"
                                th:data-redir-url="@{/docs}"
                                th:class="${invoice.commitedAt != null ? 'btn btn-outline-danger d-inline-flex align-items-center justify-content-center disabled' : 'btn btn-outline-danger d-inline-flex align-items-center justify-content-center'}"
                                onclick="deleteItem(this)"
                                title="видалити документ">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-file-earmark-x-fill" viewBox="0 0 16 16">
                                <path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M6.854 7.146 8 8.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 9l1.147 1.146a.5.5 0 0 1-.708.708L8 9.707l-1.146 1.147a.5.5 0 0 1-.708-.708L7.293 9 6.146 7.854a.5.5 0 1 1 .708-.708"/>
                            </svg>
                        </button>

                        <button th:class="${invoice.commitedAt != null ? 'btn btn-success d-inline-flex align-items-center justify-content-center' : 'btn btn-warning d-inline-flex align-items-center justify-content-center' }"
                                th:title="${invoice.commitedAt != null ? 'проведено' : 'розпроведено'}"
                                data-bs-toggle="modal"
                                data-bs-target="#commitModal">

                                <svg th:if="${invoice.commitedAt != null}" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bag-check-fill" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M10.5 3.5a2.5 2.5 0 0 0-5 0V4h5zm1 0V4H15v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4h3.5v-.5a3.5 3.5 0 1 1 7 0m-.646 5.354a.5.5 0 0 0-.708-.708L7.5 10.793 6.354 9.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"/>
                                </svg>

                                <svg th:unless="${invoice.commitedAt}" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-bag-dash" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M5.5 10a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5"/>
                                    <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
                                </svg>
                        </button>

                        <button type="button" class="btn btn-outline-primary"
                                th:data-doc-id="${invoice.id}"
                                th:data-doc-type="${invoice.docTypeId}"
                                th:data-first-pdf="${invoice.firstPdf ? true : false}"
                                th:data-first-pdf-id="${invoice.firstPdf ? invoice.fileId : null}"
                                onclick="openPdfModal(this)"
                                title="список файлів">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-journals" viewBox="0 0 16 16">
                                        <path d="M5 0h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2 2 2 0 0 1-2 2H3a2 2 0 0 1-2-2h1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1H1a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v9a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1H3a2 2 0 0 1 2-2"/>
                                        <path d="M1 6v-.5a.5.5 0 0 1 1 0V6h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V9h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 2.5v.5H.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1H2v-.5a.5.5 0 0 0-1 0"/>
                                    </svg>

                        </button>
                        <button type="button" class="btn btn-outline-primary"
                                th:data-doc-id="${invoice.id}"
                                th:data-doc-type="${invoice.docTypeId}"
                                title="історія проведень">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-clock-history" viewBox="0 0 16 16">
                                    <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z"/>
                                    <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z"/>
                                    <path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5"/>
                                </svg>

                        </button>

                        <button th:class="${invoice.commitedAt != null ? 'btn btn-outline-secondary btn-sm disabled' : 'btn btn-outline-secondary btn-sm'}"
                                onclick="showModalDiv()">+ додати майно
                        </button>
                    </div>
                </td>
            </tr>
            <tr>
                <td id="field_invoice_id" hidden th:value="${invoice.id}"></td>
                <td style="width: 150px; font-weight: bold">Типа документу:</td> <td style="width: 170px"> doc type </td>
                <td style="width: 160px; font-weight: bold">Вантажовідправник:</td> <td th:text="${invoice.sender}"></td>
                <td style="width: 120px; font-weight: bold">Представник:</td> <td th:text="${invoice.senderRespPerson}"></td>
            </tr>
            <tr>
                <td style="font-weight: bold">Номер документу:</td> <td> <span th:text="${invoice.number}"></span> </td>
                <td style="font-weight: bold">Вантажоодержувач:</td> <td th:text="${invoice.receiver}"></td>
                <td style="font-weight: bold">Представник:</td><td th:text="${invoice.receiverRespPerson}"></td>
            </tr>
            <tr>
                <td style="font-weight: bold">Дата документа:</td> <td> <span th:text="${#dates.format(invoice.documentDate, 'dd.MM.yyyy')}"></span> </td>
                <td style="font-weight: bold">Дата операції:</td> <td> <span th:text="${#dates.format(invoice.operationDate, 'dd.MM.yyyy')}"></span> </td>
                <td style="font-weight: bold">Дійсний до:</td><td> <span th:text="${#dates.format(invoice.expiresDate, 'dd.MM.yyyy')}"></span> </td>
            </tr>
        </table>
    </div>

<!------------------------------------------------------------------------------------------[ commit / uncommit modal div ]-->
<div th:replace="~{fragments/fragment-modal-commit :: confirmModal(
                                    'commitModal',
                                    'Проведення документу №' + ${invoice.number} + ' від ' + ${#dates.format(invoice.documentDate,'dd.MM.YYYY') },
                                    'Вказати дату і час проведення документу або залишити пустим для розпроведення:',
                                    @{/commit/doc-type},
                                    ${invoice.docTypeId},
                                    ${invoice},
                                    ${invoice.commitedAt},
                                    '/invoice/'
                )}">
</div>

<!--------------------------------------------------------------------------------------[ table invoice content list]-->

    <div>
        <table class="table table-bordered table-hover small">
            <thead>
                <tr>
                    <th style="text-align: center">№</th>
                    <th>Найменування</th>
                    <th>Номенклатура</th>
                    <th>Ціна, грн</th>
                    <th>К-ть БТС</th>
                    <th>К-сть ПС</th>
                    <th>К-рія</th>
                    <th>Картка</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="im, counter : ${im_list}">
                <td style="text-align: center" th:text="${counter.count}"></td>
                <td th:text="${im.getDenomination().getDenominationName()}"></td>
                <td th:text="${im.getNomenclature().getNomenclatureName()}"></td>
                <td th:text="${im.price}"></td>
                <td th:text="${#numbers.formatInteger(im.qtyBTS,0)}"></td>
                <td th:text="${#numbers.formatInteger( im.qtyPS, 0) }"></td>
                <td th:text="${im.category}"></td>
                <td th:each="card: ${im.getCards()}">
                    <a class="link-underline-dark" th:href="@{/cards/{id}/details(id=${im.getIdCard()})}" th:text="${#numbers.formatInteger(card.cardNumber,5)}"></a>
                </td>

            </tr>
            </tbody>
        </table>

    </div>

    <!------------------------------------------------------------------------------[modal div add pdf's to document]-->

    <div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">

            <div class="modal-content" id="pdfModalContent">
                <!-- Thymeleaf fragment will be inserted here -->
            </div>
        </div>
    </div>

</body>
