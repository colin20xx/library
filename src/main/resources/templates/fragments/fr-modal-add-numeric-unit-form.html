                    <div class="row p-1">

                                </tr>

                            <tbody id="tableBodyList">

                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-7">

    <!------------------------------------------------------------------------------------[ right side - temp table ]-->
                    <div class="row p-1">

                    <div class="row p-1">

                            </tr>

                </div>

        </div>
        <div class="row m-1">
            <label for="checkbox-not-close-div">
