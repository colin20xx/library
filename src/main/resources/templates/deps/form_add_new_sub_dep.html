<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"> </script>
</head>
<body>

<nav th:replace="~{fragments.html :: main_menu}"> </nav>

<div th:replace="~{fragments.html :: settings_vertical_menu_01}"> </div>

<div class="content_settings_div">

    <div class="table-container">
        <div>
            <span th:text="${dep.shortName +' - '+ dep.fullName}"></span>
        </div>
        <form method="post" th:object="${new_sub_dep}" th:action="@{/settings/deps/savenewsubdep(iddep=${dep.getId()})}">
            <div class="input-group mb-2">
                <span class="input-group-text" style="width: 300px" id="dep_short_name">Скорочена назва підрозділу:</span>
                <input type="text" class="form-control" placeholder="cкорочена назва підрозділу" th:field="*{shortName}">
            </div>

            <div class="input-group mb-2">
                <span class="input-group-text" style="width: 300px" id="dep_full_name">Повна назва підрозділу:</span>
                <input type="text" class="form-control" placeholder="повна назва підрозділу" th:field="*{longName}">
            </div>

            <div class="input-group mb-2">
                <span class="input-group-text" style="width: 300px" id="resp_persone">Матеріально відповідальна особа:</span>
                <input type="text" class="form-control" placeholder="звання ім'я прізвище" th:field="*{responsiblePerson}">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

</div>

</body>
</html>
