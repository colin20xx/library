<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>найменування</title>
    <th:block th:replace="~{fragments.html :: baseContent}"></th:block>
<!--    <link rel="stylesheet" href="../../static/css/bootstrap.min.css">-->
<!--    <link rel="stylesheet" href="../../static/css/styles.css">-->
<!--    <link rel="stylesheet" href="../../static/css/flatpickr.min.css">-->
<!--    <link rel="stylesheet" href="../../static/css/select2.min.css">-->
<!--    <link rel="stylesheet" href="../../static/css/bootstrap-icons.min.css">-->
<!--    <link rel="stylesheet" href="../../static/css/bootstrap-icons.css">-->
<!--    <script src="../../static/js/bootstrap.bundle.min.js"> </script>-->
<!--    <script src="../../static/js/jquery-4.0.0.min.js"> </script>-->
<!--    <script src="../../static/js/script.js"> </script>-->
<!--    <script src="../../static/js/flatpickr.min.js"> </script>-->
<!--    <script src="../../static/js/select2.min.js"> </script>-->
</head>
<body>

<nav th:replace="~{fragments.html :: main_menu}"> </nav>


<div th:replace="~{fragments.html :: settings_vertical_menu_01}"> </div>

    <div class="content_settings_div">
        <form  th:action="@{/settings/denominations/save_new_denomination}" th:object="${new_denom}" method="post">
            <div class="input-group mb-2">
                <span class="input-group-text" id="basic-addon4">Об'єкт:</span>
                <select class="form-control" aria-describedby="basic-addon4" name="om_id">
                    <option>---</option>
                    <option th:each="om: ${om_list}"
                            th:value="${om.getId()}"
                            th:text="${om.getObjectName()}">
                    </option>
                </select>

                <span class="input-group-text" id="basic-addon5">Найменування:</span>
                <input type="text" class="form-control" placeholder="" aria-label="" aria-describedby="basic-addon1" th:field="*{denominationName}">
                <span class="input-group-text" id="basic-addon6">Опис:</span>
                <input type="text" class="form-control" placeholder="" aria-label="" aria-describedby="basic-addon2" th:field="*{comments}">
                <button class="btn btn-outline-secondary" type="submit" id="button-addon3" >Додати</button>
            </div>
        </form>

        <form method="post">
            <div class="input-group mb-2">
                <span class="input-group-text" id="basic-addon7">Найменування:<br>(приклад: назва1,назва2)</span>
                <textarea name="objects_list" class="input-group-text" aria-describedby="basic-addon7">назва1,назва2</textarea>
                <span class="input-group-text" id="basic-addon8">Опис<br>(приклад: опис1, опис2)</span>
                <textarea name="objects_comment_list" class="input-group-text" aria-describedby="basic-addon8">опис1,опис2</textarea>
                <button class="btn btn-outline-secondary" type="submit" id="button-addon8">Додати</button>
            </div>
        </form>

        <div class="container-fluid mb-1 bg-light p-2">
            <div class="row">
                <div class="col-11">
                    <input type="text" placeholder="найменування">
                </div>

                <div class="col-1 d-flex justify-content-end">
                    <a th:href="@{/excel/export}"
                       class="btn btn-outline-success d-inline-flex align-items-center justify-content-center "
                       style="width: 40px; height: 40px;"> <i class="bi bi-file-earmark-excel-fill fs-3 lh-1"></i>
                    </a>
                </div>
            </div>
        </div>


        <div class="table-container">
            <table class="table-common">
                <thead>
                    <tr>
                        <th style="width: 60px">ID</th>
                        <th>найменування</th>
                        <th style="width: 150px">об'єкт</th>
                        <th style="width: 150px">операції</th>
                    </tr>

                </thead>
                <tbody>
                    <tr th:each="denomin_list : ${denomList}">
                        <td style="text-align: center" ><span th:text="${denomin_list[0]}"></span></td>
                        <td><span th:text="${denomin_list[1]}"></span></td>
                        <td>
                            <span th:text="${denomin_list[2]}"></span></td>
                        <td>
                            <div class="container-buttons">
                                <button id="edit" disabled>&#9998;</button>
                                <button class="btn_del_denomination" th:data-id="${denomin_list[0]}"> X </button>

                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
